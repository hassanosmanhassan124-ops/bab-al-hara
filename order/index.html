<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="أدخل بياناتك وراجع طلبك من باب الحارة.">
  <title>إتمام الطلب | باب الحارة</title>
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../js/supabase-config.js"></script>
  <script defer src="../js/main.js"></script>
</head>
<body>
  <div data-site-header></div>
  <main class="container page-main">
    <div class="page-heading">
      <span class="eyebrow">خطوة أخيرة</span>
      <h1>إتمام الطلب</h1>
      <p>أدخل بيانات التواصل والتوصيل، ثم أرسل طلبك.</p>
      <div class="actions">
        <a class="text-link" href="../cart/index.html">العودة إلى السلة</a>
        <a class="text-link" href="../products/index.html">متابعة التسوق</a>
      </div>
    </div>
    <section class="checkout-layout" data-checkout>
      <form class="panel form-grid" data-checkout-form novalidate>
        <label>الاسم الكامل<input name="name" autocomplete="name" maxlength="200" required></label>
        <label>رقم الهاتف<input name="phone" type="tel" autocomplete="tel" maxlength="50" required></label>
        <label class="full">العنوان<input name="address" autocomplete="street-address" maxlength="1000" required></label>
        <label class="full">ملاحظات (اختياري)<textarea name="notes" rows="4" maxlength="2000"></textarea></label>
        <button class="button full" type="submit" data-submit-order>تأكيد وإرسال الطلب</button>
        <p class="form-note full" role="status" aria-live="polite" data-checkout-message></p>
      </form>
      <aside class="panel" aria-labelledby="checkout-summary-title">
        <h2 id="checkout-summary-title">مراجعة الطلب</h2>
        <div data-order-summary aria-live="polite"></div>
        <section class="store-policies" data-checkout-policies hidden>
          <div data-checkout-policy="delivery_information" hidden><h3>معلومات التوصيل</h3><p data-store-value="delivery_information"></p></div>
          <div data-checkout-policy="payment_information" hidden><h3>معلومات الدفع</h3><p data-store-value="payment_information"></p></div>
        </section>
      </aside>
    </section>
    <section class="panel empty-state" data-order-confirmation hidden aria-live="polite"></section>
  </main>
  <div data-site-footer></div>
</body>
</html>
