<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>إدارة التصنيفات | باب الحارة</title>
  <link rel="stylesheet" href="css/admin.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../js/supabase-config.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/categories.js"></script>
</head>
<body class="admin-dashboard-page">
  <div class="admin-page-frame">
    <header class="dashboard-header">
      <a class="admin-brand" href="dashboard.html" aria-label="العودة إلى لوحة تحكم باب الحارة">
        <span class="brand-mark" aria-hidden="true">ب</span>
        <span><strong>باب الحارة</strong><small>إدارة المتجر</small></span>
      </a>
      <div class="admin-account">
        <span class="admin-user-email" data-admin-email></span>
        <a class="admin-button admin-button-quiet admin-dashboard-link" href="dashboard.html">لوحة التحكم</a>
        <button class="admin-button admin-button-quiet" type="button" data-logout-button>
          <span data-logout-label>تسجيل الخروج</span>
          <span class="button-spinner" aria-hidden="true" hidden></span>
        </button>
      </div>
    </header>

    <main class="product-admin-main" data-protected-content hidden>
      <div class="product-page-heading">
        <div><span class="login-kicker">إدارة الكتالوج</span><h1>التصنيفات</h1><p>إضافة التصنيفات وتحديث بياناتها وحالتها.</p></div>
        <a class="admin-button" href="#category-editor">إضافة تصنيف</a>
      </div>
      <p class="admin-alert" data-categories-message role="status" aria-live="polite" hidden></p>

      <section class="admin-panel product-editor" id="category-editor" aria-labelledby="category-form-title">
        <div class="admin-panel-heading"><div><span class="login-kicker">بيانات التصنيف</span><h2 id="category-form-title" data-category-form-title>إضافة تصنيف جديد</h2></div></div>
        <form class="product-form" data-category-form>
          <label class="admin-field"><span>اسم التصنيف <b>*</b></span><input name="name" type="text" maxlength="180" required></label>
          <label class="admin-field"><span>الرابط المختصر (Slug) <b>*</b></span><input name="slug" type="text" maxlength="180" required dir="ltr" autocomplete="off"></label>
          <label class="admin-field field-wide"><span>الوصف</span><textarea name="description" rows="3" maxlength="2000"></textarea></label>
          <div class="admin-field field-wide image-field">
            <label for="category-image">صورة التصنيف (اختيارية)</label>
            <input id="category-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" data-image-input>
            <small>JPG أو PNG أو WebP — الحد الأقصى 5 ميغابايت.</small>
            <div class="image-preview" data-image-preview hidden><img alt="معاينة صورة التصنيف" data-preview-image><button type="button" class="text-button" data-clear-image>إزالة الصورة المختارة</button></div>
            <div class="current-image" data-current-image hidden><img alt="صورة التصنيف الحالية" data-current-image-element><span>الصورة الحالية</span><button type="button" class="text-button" data-remove-current-image>إزالة الصورة الحالية</button></div>
          </div>
          <label class="admin-check"><input name="is_active" type="checkbox" checked><span>تصنيف نشط</span></label>
          <div class="form-actions field-wide"><button class="admin-button" type="submit" data-save-category>حفظ التصنيف</button><button class="admin-button admin-button-quiet" type="button" data-cancel-edit hidden>إلغاء التعديل</button></div>
        </form>
      </section>

      <section class="admin-panel product-list-panel" aria-labelledby="category-list-title">
        <div class="admin-panel-heading product-list-heading"><div><span class="login-kicker">تصنيفات المتجر</span><h2 id="category-list-title">كل التصنيفات</h2></div><label class="product-search">بحث بالاسم أو الرابط<input type="search" data-category-search placeholder="اكتب اسم التصنيف أو slug" autocomplete="off"></label></div>
        <p class="admin-inline-message" data-list-message role="status" aria-live="polite">جارٍ تحميل التصنيفات…</p>
        <div class="managed-products" data-category-list></div>
      </section>
    </main>

    <main class="dashboard-check" data-auth-check aria-live="polite">
      <span class="button-spinner" aria-hidden="true"></span>
      <p>جارٍ التحقق من صلاحيات الإدارة…</p>
    </main>
  </div>
</body>
</html>
