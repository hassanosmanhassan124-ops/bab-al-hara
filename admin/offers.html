<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>إدارة العروض | باب الحارة</title>
  <link rel="stylesheet" href="css/admin.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../js/supabase-config.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/offers.js"></script>
</head>
<body class="admin-dashboard-page">
  <div class="admin-page-frame">
    <header class="dashboard-header">
      <a class="admin-brand" href="dashboard.html" aria-label="العودة إلى لوحة تحكم باب الحارة">
        <span class="brand-mark" aria-hidden="true">ب</span>
        <span><strong>باب الحارة</strong><small>إدارة المتجر</small></span>
      </a>
      <div class="admin-account">
        <span class="admin-user-email" data-admin-email></span>
        <a class="admin-button admin-button-quiet admin-dashboard-link" href="dashboard.html">لوحة التحكم</a>
        <button class="admin-button admin-button-quiet" type="button" data-logout-button>
          <span data-logout-label>تسجيل الخروج</span>
          <span class="button-spinner" aria-hidden="true" hidden></span>
        </button>
      </div>
    </header>

    <main class="product-admin-main" data-protected-content hidden>
      <div class="product-page-heading">
        <div><span class="login-kicker">إدارة الكتالوج</span><h1>العروض</h1><p>إنشاء العروض الترويجية وتحديد منتجاتها وفترتها.</p></div>
        <a class="admin-button" href="#offer-editor">إضافة عرض</a>
      </div>
      <p class="admin-alert" data-offers-message role="status" aria-live="polite" hidden></p>

      <section class="admin-panel product-editor" id="offer-editor" aria-labelledby="offer-form-title">
        <div class="admin-panel-heading"><div><span class="login-kicker">بيانات العرض</span><h2 id="offer-form-title" data-offer-form-title>إضافة عرض جديد</h2></div></div>
        <p class="admin-inline-message" data-product-message role="status"></p>
        <form class="product-form" data-offer-form>
          <label class="admin-field"><span>عنوان العرض <b>*</b></span><input name="title" type="text" maxlength="180" required></label>
          <label class="admin-field"><span>المنتج <b>*</b></span><select name="product_id" data-product-select required disabled><option value="">جارٍ تحميل المنتجات…</option></select></label>
          <label class="admin-field"><span>نسبة الخصم (%) <b>*</b></span><input name="discount_percentage" type="number" min="0" max="100" step="0.01" inputmode="decimal" required></label>
          <label class="admin-field"><span>السعر الأصلي <b>*</b></span><input name="old_price" type="number" min="0" step="0.01" inputmode="decimal" required></label>
          <label class="admin-field"><span>سعر العرض <b>*</b></span><input name="offer_price" type="number" min="0" step="0.01" inputmode="decimal" required></label>
          <label class="admin-field"><span>الحالة</span><select name="is_active"><option value="true">نشط</option><option value="false">غير نشط</option></select></label>
          <label class="admin-field"><span>بداية العرض <b>*</b></span><input name="start_date" type="datetime-local" required></label>
          <label class="admin-field"><span>نهاية العرض</span><input name="end_date" type="datetime-local"></label>
          <label class="admin-field field-wide"><span>الوصف</span><textarea name="description" rows="3" maxlength="2000"></textarea></label>
          <div class="admin-field field-wide image-field">
            <label for="offer-image">صورة العرض (اختيارية)</label>
            <input id="offer-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" data-image-input>
            <small>JPG أو PNG أو WebP — الحد الأقصى 5 ميغابايت.</small>
            <div class="image-preview" data-image-preview hidden><img alt="معاينة صورة العرض" data-preview-image><button type="button" class="text-button" data-clear-image>إزالة الصورة المختارة</button></div>
            <div class="current-image" data-current-image hidden><img alt="صورة العرض الحالية" data-current-image-element><span>الصورة الحالية</span><button type="button" class="text-button" data-remove-current-image>إزالة الصورة الحالية</button></div>
          </div>
          <div class="form-actions field-wide"><button class="admin-button" type="submit" data-save-offer>حفظ العرض</button><button class="admin-button admin-button-quiet" type="button" data-cancel-edit hidden>إلغاء التعديل</button></div>
        </form>
      </section>

      <section class="admin-panel product-list-panel" aria-labelledby="offer-list-title">
        <div class="admin-panel-heading product-list-heading"><div><span class="login-kicker">عروض المتجر</span><h2 id="offer-list-title">كل العروض</h2></div><label class="product-search">بحث بعنوان العرض أو المنتج<input type="search" data-offer-search placeholder="اكتب عنوان العرض أو المنتج" autocomplete="off"></label></div>
        <p class="admin-inline-message" data-list-message role="status" aria-live="polite">جارٍ تحميل العروض…</p>
        <div class="managed-products" data-offer-list></div>
      </section>
    </main>

    <main class="dashboard-check" data-auth-check aria-live="polite">
      <span class="button-spinner" aria-hidden="true"></span>
      <p>جارٍ التحقق من صلاحيات الإدارة…</p>
    </main>
  </div>
</body>
</html>
